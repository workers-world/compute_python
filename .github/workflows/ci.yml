# Release PR + docker smoke（不推镜像）。推 GHCR 见 build-image.yml（仅 master）。
name: CI

on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      issues: write
      actions: write
      checks: read
    uses: workers-world/worker-actions/.github/workflows/worker-ci.yml@actions/v0.2.41
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NOTIFY_GHA_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
    with:
      materialize_sdk: false
      run_tests: false
      sync_packages_lock: false

  docker-smoke:
    permissions:
      contents: read
    uses: workers-world/container-actions/.github/workflows/container-ci.yml@927e10a8e92c1824e1ba8936790fc06debda6545
    with:
      image: ghcr.io/workers-world/compute_python
